<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Nongambles tab mark: the lime struck-through circle from
    src/components/Logo.tsx — the offers that do NOT survive the math — on the
    site's near-black ground.

    Strokes are deliberately heavy: at 16px a hairline ring disappears
    entirely. The <rect> must stay FIRST and keep an explicit fill — apple-icon.tsx
    reads it as the plate colour to composite against on iOS.
  -->
  <rect width="32" height="32" rx="8" fill="#151c21"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#c9f24d" stroke-width="2.4"/>
  <path d="M11.4 20.6L20.6 11.4" fill="none" stroke="#c9f24d" stroke-width="3"
        stroke-linecap="round"/>
</svg>
